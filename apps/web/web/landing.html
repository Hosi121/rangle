<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="rangle — 映像と自由視点で、スポーツのハイライトを見返す。">
  <meta name="theme-color" content="#101211">
  <link rel="icon" href="data:,">
  <title>rangle | スポーツを、もう一度。</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101211; color: #f0f2ed; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; }
    main { width: min(100%, 48rem); padding: max(2rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(2rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left)); }
    h1 { margin: 0 0 1.5rem; font-size: clamp(2.5rem, 8vw, 4rem); line-height: 1.15; }
    p { margin: 0 0 2rem; max-width: 32rem; font-size: 1.125rem; line-height: 1.8; color: #bac1b7; }
    a { display: inline-flex; align-items: center; min-height: 3rem; padding: .75rem 1.5rem; border-radius: 2rem; background: #b9ef7e; color: #1c2b12; font-weight: 700; text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible { outline: 2px solid #b9ef7e; outline-offset: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>rangle</h1>
    <p>スポーツの一瞬を、違う角度から。<br>映像と自由視点で、ハイライトを見返す。</p>
    <a href="/demo/">デモを開く</a>
  </main>
</body>
</html>
